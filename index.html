<style>
:root{
  --paper:#E4E4E4; --sheet:#FAFAFA; --sheet-2:#EFEFEF; --grid:rgba(0,0,0,.09);
  --ink:#0A0A0A; --ink-2:#4D4D4D; --ink-3:#8C8C8C; --line:#D4D4D4;
  --pen:#0A0A0A; --on-pen:#FFFFFF; --pen-soft:rgba(0,0,0,.07); --red:#E5484D; --red-soft:rgba(229,72,77,.12);
  --ok:#2F9E5F; --hi:48%;
  --shadow:0 1px 0 rgba(0,0,0,.05), 0 8px 22px -14px rgba(0,0,0,.35);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --sheet:#101010; --sheet-2:#191919; --grid:rgba(255,255,255,.07);
    --ink:#F2F2F2; --ink-2:#A3A3A3; --ink-3:#5F5F5F; --line:#242424;
    --pen:#F2F2F2; --on-pen:#000000; --pen-soft:rgba(255,255,255,.08); --red:#FF5C63; --red-soft:rgba(255,92,99,.13);
    --ok:#4ADE80; --hi:32%;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 26px -14px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --sheet:#101010; --sheet-2:#191919; --grid:rgba(255,255,255,.07);
  --ink:#F2F2F2; --ink-2:#A3A3A3; --ink-3:#5F5F5F; --line:#242424;
  --pen:#F2F2F2; --on-pen:#000000; --pen-soft:rgba(255,255,255,.08); --red:#FF5C63; --red-soft:rgba(255,92,99,.13);
  --ok:#4ADE80; --hi:32%;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 26px -14px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.4px);background-size:20px 20px;background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* Layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));padding:22px 16px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--sheet);overflow-y:auto}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1;padding:2px 8px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--ink-3);letter-spacing:0;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;font-weight:500;color:var(--ink-2)}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--sheet-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--pen-soft);color:var(--pen);font-weight:600}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--red);color:#fff;border-radius:20px;padding:1px 7px}
.side-tools{margin-top:auto}.side-foot{font-size:12px;color:var(--ink-3);padding:0 8px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.dot.ok{background:var(--ok)}

.main{padding:26px clamp(14px,3vw,40px) 90px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,48px);letter-spacing:-.035em;line-height:.98;margin:0}
h1 .sub{display:block;font-family:var(--body);font-size:15px;font-weight:500;letter-spacing:0;color:var(--ink-2);margin-top:8px}
h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.015em;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .count{font-family:var(--body);font-size:12.5px;color:var(--ink-3);font-weight:600}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.iconbtn{border:0;background:none;padding:5px;border-radius:7px;color:var(--ink-3);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--sheet-2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}

/* Highlighter tag */
.tag{--c:#999;display:inline-block;font-size:12.5px;font-weight:600;line-height:1.35;padding:1px 8px;border-radius:3px 7px 4px 8px;color:var(--ink);white-space:nowrap;
  background:linear-gradient(100deg,transparent 1.5%,color-mix(in srgb,var(--c) var(--hi),transparent) 4%,color-mix(in srgb,var(--c) calc(var(--hi) + 8%),transparent) 60%,color-mix(in srgb,var(--c) var(--hi),transparent) 96%,transparent 98.5%)}
.swatch{width:12px;height:12px;border-radius:3px;background:var(--c);display:inline-block;flex:none}

/* Checkbox */
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.8px solid var(--ink-3);border-radius:6px;display:inline-grid;place-items:center;flex:none;margin:0;background:var(--sheet);cursor:pointer;transition:background .15s,border-color .15s}
.chk::after{content:"";width:10px;height:6px;border-left:2.4px solid var(--sheet);border-bottom:2.4px solid var(--sheet);transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s}
.chk:checked{background:var(--ink);border-color:var(--ink)}
.chk:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}

/* 14-day strip */
.strip{display:grid;grid-template-columns:repeat(14,minmax(46px,1fr));gap:6px;overflow-x:auto;padding:4px 2px 10px}
.day{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:8px 4px 9px;text-align:center;cursor:pointer;min-height:104px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.day:hover{border-color:var(--ink-3)}
.day .wd{font-size:11.5px;color:var(--ink-3);font-weight:600}
.day .dn{font-family:var(--display);font-weight:700;font-size:21px;line-height:1;width:38px;height:38px;display:grid;place-items:center;position:relative}
.day.today{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.day.today .wd{color:color-mix(in srgb,var(--sheet) 70%,transparent)}
.day.wknd{background:var(--sheet-2)}
.day.today.wknd{background:var(--ink)}
.day .ring{position:absolute;inset:-3px;pointer-events:none;color:var(--red)}
.day .ring path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.day .ex{font-size:10.5px;font-weight:700;color:var(--red);line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.day.today .ex{color:#FF8FA0}
.day .marks{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:auto}
.day .marks i{width:6px;height:6px;border-radius:50%;background:var(--pen)}
.day .marks i.b{border-radius:2px;background:var(--c)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;margin-top:2px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .title{font-weight:600;overflow-wrap:anywhere}
.item.done .title{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--ink-2)}
.when{font-weight:600;color:var(--ink-2)}
.when.late{color:var(--red)}
.when.soon{color:var(--pen)}
.notes{font-size:13px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap}
.prio{font-size:12px;font-weight:700;color:var(--red)}
.actions{display:flex;gap:2px;opacity:.75}
.item:hover .actions{opacity:1}
.empty{color:var(--ink-3);font-size:14px;padding:14px 0;text-align:center}
.empty .btn{margin-top:10px}
.group-h{font-size:13px;font-weight:700;color:var(--ink-2);margin:16px 0 2px;display:flex;gap:8px;align-items:center}
.group-h.late{color:var(--red)}

/* Quick add */
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.quick input[type=text]{flex:1 1 220px}
.field, .quick input, .quick select{border:1px solid var(--line);background:var(--sheet-2);border-radius:10px;padding:8px 11px;min-width:0}
.field:focus, .quick input:focus, .quick select:focus{outline:2px solid var(--pen);outline-offset:-1px;background:var(--sheet)}

/* Timeline (Hoy) */
.tl{position:relative;padding-left:58px}
.tl-row{position:relative;padding:8px 10px 9px 14px;border-radius:10px;margin-bottom:7px;border-left:4px solid var(--c,var(--ink-3));background:color-mix(in srgb,var(--c,#888) 13%,var(--sheet));cursor:pointer}
.tl-row.class{--c:var(--ink-3);background:repeating-linear-gradient(135deg,var(--sheet-2) 0 7px,var(--sheet) 7px 14px);cursor:default}
.tl-row.done .t{text-decoration:line-through;color:var(--ink-3)}
.tl-row .tm{position:absolute;left:-58px;top:8px;width:50px;text-align:right;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tl-row .t{font-weight:600}
.tl-row .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.nowline{position:relative;height:0;border-top:2px solid var(--red);margin:4px 0 11px}
.nowline::before{content:"";position:absolute;left:-7px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.nowline span{position:absolute;left:-58px;top:-10px;width:50px;text-align:right;font-size:12px;font-weight:700;color:var(--red)}

/* Exam cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ecard{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.ecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.ecard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ecard .title{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.15}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;letter-spacing:-.04em;text-align:right}
.big small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:0;color:var(--ink-3);margin-top:4px}
.big.hot{color:var(--red)}
.progress{height:6px;background:var(--sheet-2);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:6px}
.topics{display:flex;flex-direction:column;gap:5px;font-size:14px}
.topics label{display:flex;gap:8px;align-items:center;cursor:pointer}
.topics label.done span{text-decoration:line-through;color:var(--ink-3)}
.topics .chk{width:17px;height:17px;border-radius:5px}
.topics .chk::after{width:8px;height:5px}
.grade{font-family:var(--display);font-weight:800;font-size:30px}
.ecard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

/* Planner */
.wk-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.planner-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--sheet);box-shadow:var(--shadow)}
.planner{min-width:820px;display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr))}
.ph{position:sticky;top:0;z-index:3;background:var(--sheet);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:9px 6px 8px;min-height:62px;display:flex;flex-direction:column;gap:4px}
.ph:first-child{border-left:0}
.ph .d{display:flex;align-items:baseline;gap:6px;justify-content:space-between}
.ph .d b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.ph .d span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.ph.today .d b{background:var(--red);color:#fff;border-radius:20px;padding:0 9px;font-size:17px}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:7px;padding:3px 6px;cursor:pointer;overflow:hidden;line-height:1.25;border:0;text-align:left;width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.exam{background:var(--red-soft);color:var(--red)}
.chip.due{background:var(--pen-soft);color:var(--pen)}
.chip.todo{background:color-mix(in srgb,var(--c) 22%,var(--sheet));color:var(--ink)}
.chip.todo.done span{text-decoration:line-through;color:var(--ink-3)}
.chip .chk{width:14px;height:14px;border-radius:4px;border-width:1.5px}
.chip .chk::after{width:7px;height:4px;border-width:2px}
.addchip{border:1px dashed var(--line);background:none;color:var(--ink-3);font-size:12px;border-radius:7px;padding:2px 6px;text-align:left}
.addchip:hover{color:var(--ink);border-color:var(--ink-3)}
.gutter{position:relative}
.gutter span{position:absolute;right:8px;font-size:11.5px;font-weight:600;color:var(--ink-3);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);cursor:copy;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);background-position:0 0,0 var(--half);background-size:100% var(--hour),100% var(--hour)}
.col.wknd{background-color:color-mix(in srgb,var(--sheet-2) 60%,transparent)}
.cls{position:absolute;left:3px;right:3px;border-radius:7px;background:repeating-linear-gradient(135deg,var(--sheet-2) 0 6px,transparent 6px 12px);border:1px dashed var(--line);font-size:11.5px;color:var(--ink-3);padding:3px 6px;overflow:hidden;pointer-events:none}
.blk{position:absolute;border-radius:8px;padding:4px 7px 6px;font-size:12.5px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  background:color-mix(in srgb,var(--c) 26%,var(--sheet));border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));border-left:4px solid var(--c);color:var(--ink);z-index:2}
.blk:hover{box-shadow:var(--shadow)}
.blk.dragging{opacity:.9;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);z-index:10;cursor:grabbing}
.blk.done{opacity:.6}
.blk.done .bw{text-decoration:line-through}
.blk .bt{font-weight:700;font-size:11.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:4px;align-items:center}
.blk .bw{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.blk .chk{width:15px;height:15px;border-radius:4px;border-width:1.5px}
.blk .chk::after{width:7px;height:4px;border-width:2px}
.blk .rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;background:var(--red);border-radius:50%}
.hint{font-size:13px;color:var(--ink-3);margin-top:10px}

/* Stats */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--sheet-2);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:color-mix(in srgb,var(--c) 70%,transparent);border-radius:4px}
.bar .v{text-align:right;font-weight:600;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.03em;line-height:1}
.kpi span{font-size:13px;color:var(--ink-2)}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:6px}
.week7 div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--ink-3)}
.week7 i{width:100%;max-width:34px;background:linear-gradient(var(--ink),var(--ink-3));border-radius:6px 6px 2px 2px;min-height:3px}
table.grades{width:100%;border-collapse:collapse;font-size:14px}
table.grades td,table.grades th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
table.grades th{font-size:12.5px;color:var(--ink-3);font-weight:600;border-top:0}
table.grades td.n{text-align:right;font-weight:700}

/* Filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{border:1px solid var(--line);background:var(--sheet);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.fbtn.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* Settings */
.srow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.srow:first-child{border-top:0}
.palette{display:flex;gap:5px;flex-wrap:wrap}
.palette button{width:22px;height:22px;border-radius:6px;border:2px solid transparent;background:var(--c)}
.palette button.on{border-color:var(--ink)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .15s ease}
.modal{background:var(--sheet);border:1px solid var(--line);border-radius:18px;width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:pop .18s ease}
.modal h3{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.form .field{width:100%;color:var(--ink);font-weight:500}
.form textarea.field{min-height:76px;resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mfoot .left{margin-right:auto}
.subjpick{display:flex;gap:6px;flex-wrap:wrap}
.subjpick button{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 6px}
.subjpick button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:fade .2s ease}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700}
@keyframes fade{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.toast{transform:translateX(-50%)}

/* Cuenta atrás del curso */
.course{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);gap:22px 32px;align-items:start}
.cbig{font-family:var(--display);font-weight:800;font-size:clamp(64px,8vw,104px);line-height:.82;letter-spacing:-.055em}
.clabel{font-size:14px;color:var(--ink-2);margin-top:8px;font-weight:500}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cstats div{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--sheet-2)}
.cstats b{display:block;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.cstats span{font-size:12px;color:var(--ink-3);font-weight:600}
.cbar{height:6px;border-radius:6px;background:var(--sheet-2);margin-top:14px;overflow:hidden;border:1px solid var(--line)}
.cbar i{display:block;height:100%;background:var(--ink)}
.months{display:flex;flex-direction:column;gap:5px;min-width:0}
.mrow{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;align-items:center}
.mrow>span{font-size:12px;font-weight:700;color:var(--ink-3)}
.mdays{display:grid;grid-template-columns:repeat(31,minmax(0,1fr));gap:3px}
.sq{aspect-ratio:1;max-width:18px;border-radius:3px;background:var(--sheet-2);border:1px solid var(--line)}
.sq.p{background:#fff;border-color:#fff}
.sq.t{background:var(--red);border-color:var(--red)}
@media (max-width:900px){.course{grid-template-columns:1fr}.mdays{gap:2px}}
.course-page .sq{max-width:26px;border-radius:4px}
.course-page .mdays{gap:4px}
.course-page .mrow{grid-template-columns:44px minmax(0,1fr)}
/* Notas */
.gadd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.gadd>*{border:1px solid var(--line);background:var(--sheet-2);border-radius:10px;padding:8px 11px;min-width:0}
#gTitle{flex:1 1 180px}
.gadd input[type=number]{flex:0 1 90px}
.gadd input[type=date]{flex:0 1 150px}
.gadd select{flex:0 1 150px}
.gadd .btn{background:var(--pen);border-color:var(--pen);color:var(--on-pen);flex:0 0 auto}
.gadd input:focus,.gadd select:focus{outline:2px solid var(--pen);outline-offset:-1px;background:var(--sheet)}
.gval{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1;min-width:52px;text-align:right}
.gval.low{color:var(--red)}
.avgbig{font-family:var(--display);font-weight:800;font-size:72px;letter-spacing:-.05em;line-height:.85}
.danger-zone{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ncard{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;min-width:0}
.ncard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.nhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nname{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.015em;line-height:1.1}
.navg{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.04em;line-height:.9}
.navg.low,.nrow b.low{color:var(--red)}
.nbar{height:5px;border-radius:5px;background:var(--sheet-2);overflow:hidden}
.nbar i{display:block;height:100%;background:var(--c)}
.nlist{display:flex;flex-direction:column}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px;cursor:context-menu}
.nrow .nt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .nd{font-size:12px;color:var(--ink-3)}
.nrow b{font-family:var(--display);font-size:18px;text-align:right}
.nadd{display:flex;gap:6px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.nadd input{border:1px solid var(--line);background:var(--sheet-2);border-radius:9px;padding:6px 9px;min-width:0;font-size:13.5px}
.nadd input:first-child{flex:1}
.nadd input:nth-child(2){width:62px;flex:none}
.nadd input:focus{outline:2px solid var(--pen);outline-offset:-1px;background:var(--sheet)}
.ntotal{text-align:right}
@media (max-width:900px){.ntotal{text-align:left}}
.shpick{display:inline-flex;cursor:pointer}
.shpick input{position:absolute;opacity:0;pointer-events:none}
.shpick span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:20px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.shpick span svg{width:14px;height:14px}
.shpick input:checked+span{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.shpick input:focus-visible+span{outline:2px solid var(--pen);outline-offset:2px}
.autosh{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.autosh .chk{width:18px;height:18px}
/* Menú contextual, búsqueda, reloj */
.ctx{position:fixed;z-index:80;min-width:224px;max-width:290px;background:var(--sheet);border:1px solid var(--line);border-radius:13px;padding:5px;box-shadow:0 22px 60px -14px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.04);animation:fade .1s ease}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:500;text-align:left;color:var(--ink)}
.ctx button:hover,.ctx button:focus-visible{background:var(--sheet-2);outline:none}
.ctx button.danger{color:var(--red)}
.ctx button.danger svg{color:var(--red)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 3px}
.ctx .kbd{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:600}
.ctx .head{font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 10px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx .subs{display:flex;flex-wrap:wrap;gap:3px;padding:3px 6px 5px}
.ctx .subs button{width:auto;padding:2px;border-radius:6px}
.ctx .subs button.on{box-shadow:0 0 0 1.5px var(--ink)}
.ctx svg{width:15px;height:15px;color:var(--ink-2);flex:none}
.sres{max-height:52vh;overflow:auto;margin-top:10px;display:flex;flex-direction:column}
.sr{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 8px;border-radius:9px;text-align:left}
.sr:hover,.sr:focus-visible{background:var(--sheet-2)}
.sr .st{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .sm{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.kbd2{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:600;background:var(--sheet-2);white-space:nowrap}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(48px,6.4vw,82px);letter-spacing:-.05em;line-height:.85}
.clock small{font-size:.32em;color:var(--ink-3);margin-left:5px;letter-spacing:0;vertical-align:top;position:relative;top:.25em}
.side-tools{display:flex;gap:6px;flex-wrap:wrap}
.side-tools .btn{flex:1;justify-content:space-between}
.side-tools .kbd{font-size:11px;color:var(--ink-3);font-weight:600}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--ink)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:900px){.hero-r{align-items:flex-start}.clock{display:none}}

/* Cuestionario */
.onb{position:fixed;inset:0;z-index:92;background-color:var(--paper);overflow-y:auto;display:flex;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 0}
.onb[hidden]{display:none}
.obox{width:min(580px,100%);display:flex;flex-direction:column;gap:20px;min-height:100%}
.oprog{display:flex;gap:6px}
.oprog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.oprog i.on{background:var(--ink)}
.oq{font-family:var(--display);font-weight:800;font-size:clamp(30px,7.5vw,42px);letter-spacing:-.035em;line-height:1.02}
.ohelp{color:var(--ink-2);font-size:15.5px;margin-top:-10px;line-height:1.45}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:13px 14px;text-align:left;font-weight:650;font-size:15px;color:var(--ink);min-height:58px;line-height:1.25}
.opt small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px;margin-top:3px}
.opt.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opt.on small{color:color-mix(in srgb,var(--sheet) 65%,transparent)}
.ogrid.small{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.ogrid.small .opt{text-align:center;font-family:var(--display);font-size:20px;font-weight:800}
.olabel{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:-12px}
.onb .field{width:100%;padding:13px 14px;font-size:16px;border-radius:12px;color:var(--ink)}
.odates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.odates .field{min-width:0;-webkit-appearance:none;appearance:none}
.odates label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ochips{display:flex;flex-wrap:wrap;gap:8px}
.ochip{border:1px solid var(--line);background:var(--sheet);border-radius:22px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink-2)}
.ochip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.oadd{display:flex;gap:8px}
.oadd .field{flex:1}
.okeep{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px;font-weight:600;cursor:pointer}
.osum{border:1px solid var(--line);background:var(--sheet);border-radius:16px;padding:6px 16px}
.osum div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.osum div:first-child{border-top:0}
.osum span{color:var(--ink-2)}
.osum b{text-align:right}
.ofoot{display:flex;gap:10px;margin-top:auto;position:sticky;bottom:0;padding:18px 0 calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 35%)}
.ofoot .btn{flex:1;justify-content:center;padding:14px;font-size:15.5px;border-radius:14px}
.btn:disabled{opacity:.35;cursor:default}
/* Botón flotante */
.fab{display:none}
/* Carga */
.alogo{font-size:clamp(30px,9vw,40px)!important;white-space:nowrap}
.alogo{display:flex;align-items:center;gap:10px}
.alogo .plane{width:.8em;height:.8em;flex:none}
.boot{position:fixed;inset:0;z-index:95;display:grid;place-content:center;justify-items:center;gap:22px;background:var(--paper);transition:opacity .25s ease}
.boot[hidden]{display:none}
.boot.out{opacity:0;pointer-events:none}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s!important;animation-name:spin!important}}
/* Acceso */
.auth{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background-color:var(--paper);background-image:radial-gradient(var(--grid) 1px,transparent 1.4px);background-size:20px 20px;overflow:auto}
.auth[hidden]{display:none}
.abox{width:min(400px,100%);background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:28px 24px 24px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.alogo{font-family:var(--display);font-weight:800;font-size:56px;letter-spacing:-.05em;line-height:.9;margin-bottom:6px}
.asub{color:var(--ink-2);font-size:14px;margin-bottom:22px}
.atabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sheet-2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:18px}
.atabs button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
.atabs button.on{background:var(--ink);color:var(--sheet)}
.abox [hidden]{display:none!important} .abox label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
.abox .field{width:100%;color:var(--ink);font-weight:500;padding:11px 12px}
.abox .btn.primary{width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:6px}
.aerr{color:var(--red);font-size:13.5px;font-weight:600;min-height:20px;margin-top:10px}
.ahint{color:var(--ink-3);font-size:12.5px;margin-top:4px}
.whoami{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:11px;background:var(--sheet-2)}
.whoami .av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.whoami b{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Administrador */
.adminstar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:35;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink-2);display:grid;place-items:center;box-shadow:var(--shadow)}
.adminstar:hover{color:var(--ink);border-color:var(--ink-3)}
.adminstar svg{width:18px;height:18px}
.main{padding-right:max(clamp(14px,3vw,40px),64px)}
.adm-sum{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.adm-sum div{flex:1;min-width:110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sheet-2)}
.adm-sum b{display:block;font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.adm-sum span{font-size:12px;color:var(--ink-3);font-weight:600}
.adm-list{display:flex;flex-direction:column;max-height:50vh;overflow:auto}
.adm-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.adm-row:first-child{border-top:0}
.adm-row .av{width:30px;height:30px;border-radius:50%;background:var(--sheet-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.adm-row .nm{flex:1;min-width:0}
.adm-row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row .nm small{color:var(--ink-3);font-size:12px}
.pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px;white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.off{background:var(--red-soft);color:var(--red)}
.pill.me{background:var(--sheet-2);color:var(--ink-2)}
@media (max-width:900px){.adminstar{display:none}.main{padding-right:12px}}
/* Amigos */
.kind{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--ink-2);background:var(--sheet-2);line-height:1.6}
.kind svg{width:12px;height:12px}
.kind.sh{color:var(--ink)}
.req{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.req .av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.req .tx{flex:1;min-width:0;font-size:14px}
.req .tx b{font-weight:700}
.req .tx small{display:block;color:var(--ink-3);font-size:12.5px}
.req .bt{display:flex;gap:6px;flex:none}
.reqpanel{margin-bottom:18px;border-color:var(--ink-3)}
.fradd{display:flex;gap:8px;margin-bottom:6px}
.fradd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sheet-2);border-radius:10px;padding:8px 11px}
.fradd input:focus{outline:2px solid var(--pen);outline-offset:-1px;background:var(--sheet)}
.frlist label{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
.frlist label:first-child{border-top:0}
/* Móvil */
.mtop{display:none}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.dpick button{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink-2)}
.dpick span{font-size:11px;font-weight:600}
.dpick b{font-family:var(--display);font-size:18px;color:var(--ink);line-height:1.1}
.dpick i{display:flex;gap:3px;height:5px}
.dpick u{width:5px;height:5px;border-radius:50%;background:var(--ink-3);display:block}
.dpick u.x{background:var(--red)}
.dpick button.today b{color:var(--red)}
.dpick button.on{background:var(--ink);border-color:var(--ink)}
.dpick button.on b,.dpick button.on span{color:var(--sheet)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 14px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sheet-2);border-radius:14px;padding:14px 6px;font-size:13px;font-weight:600;color:var(--ink)}
.sitem svg{width:22px;height:22px}
.sitem.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.mav{width:32px;height:32px;border-radius:50%;border:0;background:var(--ink);color:var(--sheet);font-weight:700;font-size:14px;display:grid;place-items:center}
/* Mobile */

  .tabbar{padding-top:8px}
  .tabbar button{gap:4px}

/* ---------- Planificador ---------- */
const PX=1.15; // px por minuto
function vPlan(){
  const mon=mondayOf(pd(UI.weekRef)),days=[...Array(7)].map((_,i)=>addDays(mon,i));const MOB=innerWidth<=700;const shown=MOB?[pd(UI.weekRef)]:days;
  const st=S.settings.dayStart*60,en=S.settings.dayEnd*60,H=(en-st)*PX;
  const t=todayS(),sun=days[6];
  const title=mon.getMonth()===sun.getMonth()?`${mon.getDate()}–${sun.getDate()} de ${MON[mon.getMonth()]}`:`${mon.getDate()} ${MON[mon.getMonth()].slice(0,3)} – ${sun.getDate()} ${MON[sun.getMonth()].slice(0,3)}`;
  const weekMin=S.blocks.filter(b=>{const d=pd(b.date);return d>=mon&&d<=sun&&b.done}).reduce((a,b)=>a+blockMin(b),0);
  const planned=S.blocks.filter(b=>{const d=pd(b.date);return d>=mon&&d<=sun}).reduce((a,b)=>a+blockMin(b),0);
  let head='<div class="ph"></div>';
  for(const d of shown){const s=ds(d);
    const ex=S.exams.filter(e=>e.date===s),du=S.tasks.filter(x=>x.due===s&&!x.done),un=S.blocks.filter(b=>b.date===s&&!b.start);
    head+=`<div class="ph ${s===t?'today':''}"><div class="d"><span>${WDS[d.getDay()]}</span><b class="num">${d.getDate()}</b></div>
      ${ex.map(e=>`<button class="chip exam" data-ctx="exam:${e.id}" data-goview="examenes" title="${esc(e.title)}"><span>${esc(e.title)}</span></button>`).join('')}
      ${du.map(x=>`<button class="chip due" data-ctx="task:${x.id}" data-edittask="${x.id}" title="Entrega ${x.time||''}: ${esc(x.title)}"><span>${x.time||''} ${esc(x.title)}</span></button>`).join('')}
      ${un.map(b=>`<div class="chip todo ${b.done?'done':''}" data-ctx="block:${b.id}" style="--c:${subj(b.subj).color}" data-editblock="${b.id}"><input type="checkbox" class="chk" data-toggleblock="${b.id}" ${b.done?'checked':''} aria-label="Hecho"><span>${esc(b.what)}</span></div>`).join('')}
      <button class="addchip" data-addun="${s}">+ tarea sin hora</button></div>`;
  }
  let gut=`<div class="gutter" style="height:${H}px">`;for(let m=st;m<=en;m+=60)gut+=`<span class="num" style="top:${(m-st)*PX}px">${fromMin(m%1440)}</span>`;gut+='</div>';
  let cols='';
  const nowD=new Date(),nowM=nowD.getHours()*60+nowD.getMinutes();
  for(const d of shown){const s=ds(d),wd=d.getDay();
    let inner='';
    for(const c of S.classes.filter(c=>c.day===wd)){const a=Math.max(toMin(c.start),st),b=Math.min(toMin(c.end),en);if(b<=a)continue;inner+=`<div class="cls" style="top:${(a-st)*PX}px;height:${(b-a)*PX}px">${esc(subj(c.subj).name)}</div>`}
    const bl=S.blocks.filter(b=>b.date===s&&b.start).sort((a,b)=>toMin(a.start)-toMin(b.start));
    // carriles para solapes
    const lanes=[];const pos={};let cluster=[],cEnd=-1;
    const flush=()=>{const n=Math.max(1,...cluster.map(x=>pos[x.id].lane+1));cluster.forEach(x=>pos[x.id].n=n);cluster=[]};
    for(const b of bl){const a=toMin(b.start),e=toMin(b.end);if(a>=cEnd&&cluster.length){flush();lanes.length=0}
      let l=lanes.findIndex(x=>x<=a);if(l<0){l=lanes.length;lanes.push(e)}else lanes[l]=e;pos[b.id]={lane:l};cluster.push(b);cEnd=Math.max(cEnd,e)}
    if(cluster.length)flush();
    for(const b of bl){const a=toMin(b.start),e=toMin(b.end);const top=(Math.max(a,st)-st)*PX,h=Math.max(22,(Math.min(e,en)-Math.max(a,st))*PX-2);if(e<=st||a>=en)continue;
      const p=pos[b.id],w=100/p.n;
      inner+=`<div class="blk ${b.done?'done':''}" data-ctx="block:${b.id}" data-blk="${b.id}" style="--c:${subj(b.subj).color};top:${top}px;height:${h}px;left:calc(${p.lane*w}% + 3px);width:calc(${w}% - 6px)">
        <div class="bt"><span class="num">${b.start}–${b.end}</span><input type="checkbox" class="chk" data-toggleblock="${b.id}" ${b.done?'checked':''} aria-label="Hecho"></div>
        ${h>34?`<div class="bw">${esc(b.what||subj(b.subj).name)}</div>`:''}${h>58?`<div style="margin-top:3px">${tag(b.subj)}</div>`:''}<div class="rs" data-rs="${b.id}"></div></div>`}
    if(s===t&&nowM>=st&&nowM<=en)inner+=`<div class="now" style="top:${(nowM-st)*PX}px"></div>`;
    cols+=`<div class="col ${wd===0||wd===6?'wknd':''}" data-col="${s}" style="height:${H}px;--hour:${60*PX}px;--half:${30*PX}px">${inner}</div>`;
  }
  return `<div class="topbar"><h1>${cap(title)}<span class="sub">${Math.floor(planned/60)} h ${planned%60} min planificadas, ${Math.floor(weekMin/60)} h ${weekMin%60} min hechas esta semana.</span></h1>
   <div class="wk-nav"><button class="iconbtn" data-wk="-7" aria-label="Semana anterior">${I.left}</button><button class="btn sm" data-wk="0">Hoy</button><button class="iconbtn" data-wk="7" aria-label="Semana siguiente">${I.right}</button>
   <button class="btn sm" data-copyweek>${I.copy}Copiar semana anterior</button><button class="btn sm primary" data-new="block">${I.plus}Bloque</button></div></div>
   ${MOB?`<div class="dpick">${days.map(d=>{const s=ds(d);const nEx=S.exams.some(e=>e.date===s),nB=S.blocks.some(b=>b.date===s);return `<button type="button" class="${s===UI.weekRef?'on':''} ${s===t?'today':''}" data-pday="${s}"><span>${WDS[d.getDay()]}</span><b class="num">${d.getDate()}</b><i>${nEx?'<u class="x"></u>':''}${nB?'<u></u>':''}</i></button>`}).join('')}</div>`:''}
   <div class="planner-wrap"><div class="planner" ${MOB?'style="grid-template-columns:46px minmax(0,1fr);min-width:0"':''}>${head}${gut}${cols}</div></div>
   <p class="hint">Haz clic en un hueco para crear un bloque de estudio. Arrastra un bloque para moverlo de hora o de día, y tira del borde inferior para alargarlo. Las clases de tu horario salen rayadas.</p>`;
}

  const w=e.target.closest('[data-wk]');if(w){const v=+w.dataset.wk;UI.weekRef=v===0?todayS():ds(addDays(pd(UI.weekRef),v));render();return}

function copyPrevWeek(){
  const mon=mondayOf(pd(UI.weekRef));const prevMon=addDays(mon,-7);let n=0;
  for(const b of S.blocks.filter(b=>b.start&&pd(b.date)>=prevMon&&pd(b.date)<mon)){
    const nd=ds(addDays(pd(b.date),7));
    if(S.blocks.some(x=>x.date===nd&&x.start===b.start&&x.subj===b.subj))continue;
    S.blocks.push({...b,id:uid(),date:nd,done:false,examId:undefined});n++}
  if(!n){toast('La semana anterior no tiene bloques con hora para copiar');return}
  save();render();toast(`${n} bloques copiados de la semana anterior`);
}
function bindPlanner(){
  const st=S.settings.dayStart*60,en=S.settings.dayEnd*60;
  const snap=m=>Math.round(m/15)*15;
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('click',e=>{if(e.target!==col)return;const r=col.getBoundingClientRect();let m=snap(st+(e.clientY-r.top)/PX-15);m=Math.max(st,Math.min(en-60,m));openBlockModal({date:col.dataset.col,start:fromMin(m),end:fromMin(m+60)})});
  });
  document.querySelectorAll('.blk').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      if(e.target.closest('input')||e.button!==0)return;
      const id=el.dataset.blk,b=S.blocks.find(x=>x.id===id);if(!b)return;
      const resize=!!e.target.closest('.rs');
      const r=el.getBoundingClientRect();const grabY=e.clientY-r.top;const sx=e.clientX,sy=e.clientY;
      const dur=toMin(b.end)-toMin(b.start);let moved=false,target={date:b.date,start:toMin(b.start),end:toMin(b.end)};
      el.setPointerCapture(e.pointerId);
      const mv=ev=>{
        if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<5)return;
        moved=true;el.classList.add('dragging');
        if(resize){const cr=el.parentElement.getBoundingClientRect();let m=snap(st+(ev.clientY-cr.top)/PX);m=Math.max(target.start+15,Math.min(en,m));target.end=m;el.style.height=((m-target.start)*PX-2)+'px';el.querySelector('.num').textContent=fromMin(target.start)+'–'+fromMin(m);return}
        el.style.pointerEvents='none';const under=document.elementFromPoint(ev.clientX,ev.clientY);el.style.pointerEvents='';
        const col=under&&under.closest('.col');if(!col)return;
        if(el.parentElement!==col){col.appendChild(el);el.style.left='3px';el.style.width='calc(100% - 6px)'}
        const cr=col.getBoundingClientRect();let m=snap(st+(ev.clientY-cr.top-grabY)/PX);m=Math.max(st,Math.min(en-dur,m));
        target={date:col.dataset.col,start:m,end:m+dur};el.style.top=((m-st)*PX)+'px';el.querySelector('.num').textContent=fromMin(m)+'–'+fromMin(m+dur);
      };
      const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
        if(moved){checkpoint();b.date=target.date;b.start=fromMin(target.start);b.end=fromMin(target.end);save();render()}else if(Date.now()-ctxOpenedAt>900)openBlockModal(b)};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    });
  });
  const wrap=$('.planner-wrap');const now=wrap&&wrap.querySelector('.now');
  if(now&&wrap.scrollWidth>wrap.clientWidth){const c=now.parentElement;wrap.scrollLeft=Math.max(0,c.offsetLeft-80)}
}

/* ---------- Auto-reparto de estudio ---------- */
function freeSlot(date,dur){
  const st=S.settings.dayStart*60,en=S.settings.dayEnd*60,wd=pd(date).getDay();
  const busy=[...S.classes.filter(c=>c.day===wd),...S.blocks.filter(b=>b.date===date&&b.start)].map(x=>[toMin(x.start),toMin(x.end)]).sort((a,b)=>a[0]-b[0]);
  let t=st;
  if(date===todayS()){const n=new Date();t=Math.max(t,Math.ceil((n.getHours()*60+n.getMinutes()+10)/15)*15)}
  for(const[a,b]of busy){if(a-t>=dur)return t;if(b+10>t)t=b+10}
  return en-t>=dur?t:null;
}
function autoPlan(id,sessions,dur){
  const e=S.exams.find(x=>x.id===id);if(!e)return;
  const days=daysBetween(todayS(),e.date);let made=0;
  for(let i=1;i<=days&&made<sessions;i++){
    const d=ds(addDays(pd(e.date),-i));if(d<todayS())break;
    const t=freeSlot(d,dur);if(t==null)continue;
    const topic=e.topics.filter(x=>!x.done)[made%Math.max(1,e.topics.filter(x=>!x.done).length)];
    S.blocks.push({id:uid(),date:d,start:fromMin(t),end:fromMin(t+dur),subj:e.subj,what:(i===1?'Repaso final: ':'Estudiar: ')+(topic?topic.t:e.title.replace(/^examen\s*/i,'')),done:false,examId:e.id});made++;
  }
  save();render();
  toast(made?`${made} sesiones colocadas en tu planificador`:'No he encontrado huecos libres antes del examen');
}

/* ---------- Horario de clases ---------- */
function vHorario(){
  const cls=S.classes;const st=cls.length?Math.min(8*60,...cls.map(c=>toMin(c.start))):8*60;const en=cls.length?Math.max(15*60,...cls.map(c=>toMin(c.end))):15*60;
  const sH=Math.floor(st/60)*60,eH=Math.ceil(en/60)*60,H=(eH-sH)*PX;
  let head='<div class="ph"></div>'+[1,2,3,4,5].map(d=>`<div class="ph"><div class="d"><span></span><b style="font-size:16px">${cap(WD[d])}</b></div></div>`).join('');
  let gut=`<div class="gutter" style="height:${H}px">`;for(let m=sH;m<=eH;m+=60)gut+=`<span class="num" style="top:${(m-sH)*PX}px">${fromMin(m)}</span>`;gut+='</div>';
  let cols='';for(const d of [1,2,3,4,5]){cols+=`<div class="col" data-hcol="${d}" data-st="${sH}" style="height:${H}px;--hour:${60*PX}px;--half:${30*PX}px">`+cls.filter(c=>c.day===d).map(c=>{const a=toMin(c.start),b=toMin(c.end);return `<div class="blk" data-ctx="class:${c.id}" data-cls="${c.id}" style="--c:${subj(c.subj).color};top:${(a-sH)*PX}px;height:${(b-a)*PX-2}px;left:3px;width:calc(100% - 6px);cursor:pointer"><div class="bt"><span class="num">${c.start}–${c.end}</span></div><div class="bw">${esc(subj(c.subj).name)}</div>${c.room?`<div style="font-size:11.5px;color:var(--ink-2)">${esc(c.room)}</div>`:''}</div>`}).join('')+'</div>'}
  return `<div class="topbar"><h1>Horario de clases<span class="sub">Tus clases fijas del insti. Se ven en Hoy y el reparto automático no te pondrá estudio encima.</span></h1><button class="btn primary" data-new="class">${I.plus}Añadir clase</button></div>
  <div class="planner-wrap"><div class="planner" style="grid-template-columns:54px repeat(5,minmax(0,1fr));min-width:620px">${head}${gut}${cols}</div></div>
  <p class="hint">Haz clic en un hueco para añadir una clase en esa hora.</p>`;
}
function bindHorario(){
  document.querySelectorAll('[data-hcol]').forEach(col=>col.addEventListener('click',e=>{
    const c=e.target.closest('[data-cls]');if(c){openClassModal(S.classes.find(x=>x.id===c.dataset.cls));return}
    if(e.target!==col)return;const r=col.getBoundingClientRect();const m=Math.round((+col.dataset.st+(e.clientY-r.top)/PX-15)/15)*15;
    openClassModal({day:+col.dataset.hcol,start:fromMin(m),end:fromMin(m+60)})}));
}

/* ---------- Progreso ---------- */
function studyByDay(d){return S.blocks.filter(b=>b.date===d&&b.done).reduce((a,b)=>a+blockMin(b),0)+S.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.min,0)}
function vProgreso(){
  const mon=mondayOf(new Date()),days=[...Array(7)].map((_,i)=>ds(addDays(mon,i)));
  const per={};for(const s of S.subjects)per[s.id]=0;
  for(const b of S.blocks)if(b.done&&days.includes(b.date))per[b.subj]=(per[b.subj]||0)+blockMin(b);
  for(const s of S.sessions)if(days.includes(s.date))per[s.subj]=(per[s.subj]||0)+s.min;
  const tot=Object.values(per).reduce((a,b)=>a+b,0),max=Math.max(60,...Object.values(per));
  const daily=days.map(studyByDay),dmax=Math.max(60,...daily);
  let streak=0;for(let i=0;i<365;i++){const d=ds(addDays(new Date(),-i));if(studyByDay(d)>0)streak++;else if(i>0)break}
  const doneWk=S.tasks.filter(t=>t.done&&t.doneAt&&t.doneAt>=mon.getTime()).length;
  const graded=allGrades();
  const avg=graded.length?(graded.reduce((a,e)=>a+ +e.grade,0)/graded.length):null;
  const bySubj=S.subjects.map(s=>{const g=graded.filter(e=>e.subj===s.id);return{s,n:g.length,avg:g.length?g.reduce((a,e)=>a+ +e.grade,0)/g.length:null}}).filter(x=>x.n);
  const h=m=>`${Math.floor(m/60)} h ${pad(m%60)}`;
  return `<div class="topbar"><h1>Progreso<span class="sub">Lo que has estudiado esta semana y cómo van tus notas.</span></h1></div>
  <div class="kpis"><div class="kpi"><b class="num">${h(tot)}</b><span>de estudio esta semana</span></div><div class="kpi"><b class="num">${streak}</b><span>${streak===1?'día seguido':'días seguidos'} estudiando</span></div><div class="kpi"><b class="num">${doneWk}</b><span>deberes entregados esta semana</span></div><div class="kpi"><b class="num">${avg!=null?avg.toFixed(2):'–'}</b><span>nota media de exámenes</span></div></div>
  <div class="grid2"><section class="panel"><h2>Horas por asignatura</h2><div class="bars">${S.subjects.map(s=>`<div class="bar"><span>${esc(s.name)}</span><div class="track"><i style="--c:${s.color};width:${100*per[s.id]/max}%"></i></div><span class="v num">${h(per[s.id]||0)}</span></div>`).join('')}</div><p class="hint">Cuenta los bloques de estudio marcados como hechos.</p></section>
  <div class="stack"><section class="panel"><h2>Esta semana, día a día</h2><div class="week7">${daily.map((m,i)=>`<div title="${h(m)}"><span class="num" style="color:var(--ink-2);font-weight:600">${m?Math.round(m/6)/10+'h':''}</span><i style="height:${Math.max(3,100*m/dmax)}%"></i>${WDS[(i+1)%7]}</div>`).join('')}</div></section>
  <section class="panel"><h2>Notas</h2>${graded.length?`<table class="grades"><tr><th>Asignatura</th><th>Exámenes</th><th style="text-align:right">Media</th></tr>${bySubj.map(x=>`<tr><td>${tag(x.s.id)}</td><td class="num">${x.n}</td><td class="n num">${x.avg.toFixed(2)}</td></tr>`).join('')}</table>`:'<div class="empty">Cuando pongas la nota de un examen, aparecerá aquí con la media por asignatura.</div>'}</section></div></div>`;
}

/* ---------- Ajustes ---------- */

   <div class="srow"><span style="flex:1">Día completo, de 00:00 a 00:00</span><button class="btn sm ${S.settings.dayStart===0&&S.settings.dayEnd===24?'primary':''}" data-fullday>${S.settings.dayStart===0&&S.settings.dayEnd===24?'Activado':'Activar'}</button></div>
   <div class="srow"><span style="flex:1">Tema</span><select class="field" data-set="theme"><option value="auto" ${S.settings.theme==='auto'?'selected':''}>Automático</option><option value="light" ${S.settings.theme==='light'?'selected':''}>Claro</option><option value="dark" ${S.settings.theme==='dark'?'selected':''}>Oscuro</option></select></div></section>
  <section class="panel"><h2>Copia de seguridad</h2><p class="hint" style="margin-top:0">Copia este texto y guárdalo; pégalo aquí para recuperar todo. También sirve para traer tus datos de la versión de Claude.</p><textarea class="field" id="backup" style="width:100%;min-height:90px;font-size:12px" aria-label="Copia de seguridad"></textarea>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm" data-export>Generar copia</button><button class="btn sm" data-import>Restaurar desde el texto</button></div></section>
  <section class="panel"><h2>Curso</h2><div class="srow"><span style="flex:1">Empieza el</span><input class="field" type="date" data-course="start" value="${S.course.start}"></div><div class="srow"><span style="flex:1">Acaba el</span><input class="field" type="date" data-course="end" value="${S.course.end}"></div></section>
  <section class="panel"><h2>Tus estudios</h2><div class="srow"><span style="flex:1">${S.perfil&&S.perfil.etiqueta?esc(S.perfil.etiqueta):'Sin indicar'}</span><button class="btn sm" data-reonb>Cambiar</button></div></section>
  <section class="panel"><h2>Cuenta</h2><div class="srow"><span style="flex:1">Has iniciado sesión como <b>${esc(CUR?(CUR.displayName||CUR.email.split('@')[0]):'')}</b></span><button class="btn sm" data-logout>Cerrar sesión</button></div></section>
  <section class="panel danger-zone"><h2>Borrar todo</h2><p class="hint" style="margin-top:0">Borra todos los deberes, exámenes, notas, bloques de estudio y clases. Las asignaturas y los ajustes se quedan. Justo después puedes deshacerlo.</p><button class="btn danger" data-reset>${I.trash}Borrar todo</button></section></div></div>`;
}
document.addEventListener('change',e=>{
  const n=e.target.dataset.sname;if(n){subj(n).name=e.target.value.trim()||'Asignatura';save();renderNav()}
  const k=e.target.dataset.set;if(k){S.settings[k]=k==='theme'?e.target.value:+e.target.value;if(S.settings.dayEnd<=S.settings.dayStart){if(k==='dayEnd')S.settings.dayStart=Math.max(0,S.settings.dayEnd-1);else S.settings.dayEnd=Math.min(24,S.settings.dayStart+1)}save();render()}
});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-scolor]');if(c){const[id,col]=c.dataset.scolor.split('|');subj(id).color=col;save();render();return}
  const d=e.target.closest('[data-sdel]');if(d){const id=d.dataset.sdel;const used=S.tasks.some(t=>t.subj===id)||S.exams.some(t=>t.subj===id)||S.blocks.some(t=>t.subj===id);
    if(used&&!confirm('Esta asignatura tiene deberes, exámenes o bloques. Se quedarán como "Otra". ¿Borrarla?'))return;S.subjects=S.subjects.filter(s=>s.id!==id);save();render();return}
  if(e.target.closest('[data-sadd]')){S.subjects.push({id:uid(),name:'Nueva asignatura',color:PALETTE[S.subjects.length%PALETTE.length]});save();render();return}
  if(e.target.closest('[data-export]')){$('#backup').value=JSON.stringify(S);$('#backup').select();toast('Copia generada. Cópiala y guárdala.');return}
  if(e.target.closest('[data-import]')){try{const n=migrate(JSON.parse($('#backup').value));S=n;save();render();toast('Datos restaurados')}catch(err){toast('El texto no es una copia válida')}return}
  if(e.target.closest('[data-reset]')){if(confirm('¿Seguro que quieres borrar todos los deberes, exámenes, notas, bloques y clases?')){checkpoint();S.tasks=[];S.exams=[];S.blocks=[];S.classes=[];S.grades=[];S.sessions=[];save();render();toast('Todo borrado',undoLast)}}
});

document.addEventListener('click',e=>{
  if(e.target.closest('input[type=checkbox]'))return;
  const nw=e.target.closest('[data-new]');if(nw){const k=nw.dataset.new;if(k==='task')openTaskModal();else if(k==='exam')openExamModal();else if(k==='class')openClassModal();else openBlockModal();return}
  const et=e.target.closest('[data-edittask]');if(et){openTaskModal(S.tasks.find(x=>x.id===et.dataset.edittask));return}

  const eb=e.target.closest('[data-editblock]');if(eb&&!e.target.closest('[data-blk]')){openBlockModal(S.blocks.find(x=>x.id===eb.dataset.editblock));return}

  const ap=e.target.closest('[data-autoplan]');if(ap){openAutoModal(S.exams.find(x=>x.id===ap.dataset.autoplan));return}
  const gr=e.target.closest('[data-grade]');if(gr){openGradeModal(S.exams.find(x=>x.id===gr.dataset.grade));return}
});

/* ---------- Modales ---------- */
function modal(html,onSubmit,onMount){
  const root=$('#modalRoot');const prev=document.activeElement;
  root.innerHTML=`<div class="scrim" role="dialog" aria-modal="true"><form class="modal" novalidate>${html}</form></div>`;
  const sc=root.querySelector('.scrim'),f=root.querySelector('form');
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',kd);prev&&prev.focus&&prev.focus()};
  const kd=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',kd);
  sc.addEventListener('mousedown',e=>{if(e.target===sc)close()});
  f.addEventListener('click',e=>{if(e.target.closest('[data-close]')){e.preventDefault();close()}});
  f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit(new FormData(f),f)!==false)close()});
  onMount&&onMount(f,close);
  setTimeout(()=>{const a=f.querySelector('[autofocus]')||f.querySelector('input,select,textarea');a&&a.focus()},30);
}
function subjPick(cur){cur=cur||S.subjects[0]?.id;return `<div class="full"><span style="font-size:13px;font-weight:600;color:var(--ink-2)">Asignatura</span><div class="subjpick" style="margin-top:5px">${S.subjects.map(s=>`<button type="button" class="${s.id===cur?'on':''}" data-pick="${s.id}">${tag(s.id)}</button>`).join('')}</div><input type="hidden" name="subj" value="${cur||''}"></div>`}
function bindPick(f){f.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{f.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.elements.subj.value=b.dataset.pick}))}
const foot=(del)=>`<div class="mfoot">${del?`<button type="button" class="btn danger left" data-del>${I.trash}Borrar</button>`:''}<button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>`;


/* ---------- Compartir desde el formulario ---------- */
const friendsOk=()=>Object.entries(SOC.amigos||{}).filter(([,v])=>v.estado==='ok');
function sharePickHTML(o,isNew){const fr=friendsOk();if(!fr.length)return'';const auto=S.autoShare||{};
  return `<div class="full"><span style="font-size:13px;font-weight:600;color:var(--ink-2)">Compartir con</span><div class="subjpick" style="margin-top:6px">${fr.map(([u,v])=>`<label class="shpick"><input type="checkbox" name="shareTo" value="${u}" ${isNew&&auto[u]?'checked':''}><span>${I.users}${esc(v.nombre)}</span></label>`).join('')}</div>${o&&o.shareId?'<div class="hint" style="margin-top:6px">Ya está compartido. Marca a alguien más si quieres añadirlo.</div>':''}</div>`}
function autoShareNew(type,o){const a=Object.keys(S.autoShare||{}).filter(u=>S.autoShare[u]&&friendsOk().some(([x])=>x===u));if(a.length)shareItem(type,o,a)}

function openTaskModal(t){
  const n=!t;t=t||{subj:UI.taskFilter!=='all'?UI.taskFilter:S.subjects[0]?.id,title:'',due:ds(addDays(new Date(),1)),time:'08:00',prio:1,notes:''};
  modal(`<h3>${n?'Nuevo deber':'Editar deber'}</h3><div class="form">
   <label class="full">Tipo<select class="field" name="kind"><option value="" ${t.kind!=='recordatorio'?'selected':''}>Deber</option><option value="recordatorio" ${t.kind==='recordatorio'?'selected':''}>Recordatorio</option></select></label>
   <label class="full">Qué hay que hacer<input class="field" name="title" value="${esc(t.title)}" placeholder="Ej.: Ejercicios 5 y 6 página 42" autofocus required></label>
   ${subjPick(t.subj)}
   <label>Día de entrega<input class="field" type="date" name="due" value="${t.due}" required></label>
   <label>Hora de entrega<input class="field" type="time" name="time" value="${t.time||'08:00'}"></label>
   <label class="full">Prioridad<select class="field" name="prio"><option value="1" ${t.prio==1?'selected':''}>Normal</option><option value="2" ${t.prio==2?'selected':''}>Importante</option><option value="3" ${t.prio==3?'selected':''}>Urgente</option></select></label>
   <label class="full">Notas<textarea class="field" name="notes" placeholder="Dónde entregarlo, en qué formato, material…">${esc(t.notes)}</textarea></label>
   ${sharePickHTML(t,n)}
  </div>${foot(!n)}`,fd=>{
    const title=fd.get('title').trim();if(!title){toast('Escribe qué hay que hacer');return false}
    const o={kind:fd.get('kind')||'',subj:fd.get('subj'),title,due:fd.get('due')||todayS(),time:fd.get('time')||'23:59',prio:+fd.get('prio'),notes:fd.get('notes').trim()};
    let obj;if(n){obj={id:uid(),done:false,...o};S.tasks.push(obj)}else{Object.assign(t,o);obj=t}save();render();toast(n?'Deber apuntado':'Deber guardado');
    const sh=fd.getAll('shareTo');if(sh.length)shareItem('task',obj,sh);
  },(f,close)=>{bindPick(f);const d=f.querySelector('[data-del]');d&&d.addEventListener('click',()=>{S.tasks=S.tasks.filter(x=>x!==t);save();close();render();toast('Deber borrado',()=>{S.tasks.push(t);save();render()})})});
}
function openExamModal(e){

  modal(`<h3>${n?'Nuevo examen':'Editar examen'}</h3><div class="form">
   <label class="full">Tipo<select class="field" name="kind"><option value="" ${e.kind!=='presentacion'?'selected':''}>Examen</option><option value="presentacion" ${e.kind==='presentacion'?'selected':''}>Presentación</option></select></label>

function openBlockModal(b){
  const n=!b||!b.id;const st=S.settings.dayStart*60;
  b=Object.assign({date:todayS(),start:fromMin(Math.max(st,16*60)),end:fromMin(Math.max(st,16*60)+60),subj:S.subjects[0]?.id,what:'',done:false},b||{});

   <label class="full">Qué vas a hacer<input class="field" name="what" value="${esc(b.what)}" placeholder="Ej.: Resumen tema 3, ejercicios axonometría" autofocus></label>

   <label>Hasta<input class="field" type="time" name="end" value="${b.end||''}" step="300"></label>
   <label class="full" style="flex-direction:row;align-items:center;gap:8px;font-weight:500"><input type="checkbox" class="chk" name="notime" ${b.start?'':'checked'}>Sin hora concreta (sale arriba del día)</label>
   ${exOpts?`<label class="full">Cuenta para el examen<select class="field" name="examId"><option value="">Ninguno</option>${exOpts}</select></label>`:''}

function courseHTML(){
  const c=S.course,st=pd(c.start),en=pd(c.end),t=pd(todayS());
  if(en<st)return '';
  const total=daysBetween(c.start,c.end)+1;
  const passed=Math.max(0,Math.min(total,daysBetween(c.start,todayS())));
  const left=Math.max(0,daysBetween(todayS(),c.end));
  let lect=0;for(let d=new Date(Math.max(t,st));d<=en;d=addDays(d,1)){const w=d.getDay();if(w>0&&w<6)lect++}
  const weeks=Math.ceil(left/7),pct=Math.round(100*passed/total);
  const exd=new Set(S.exams.filter(e=>e.date).map(e=>e.date));
  let rows='';const mStart=new Date(st.getFullYear(),st.getMonth(),1);
  for(let m=new Date(mStart);m<=en;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    let cells='';const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
    for(let d=1;d<=dim;d++){const dt=new Date(m.getFullYear(),m.getMonth(),d);if(dt<st||dt>en)continue;const s=ds(dt),w=dt.getDay();
      const cls=['sq',dt<t?'p':'',s===todayS()?'t':''].join(' ');
      cells+=`<i class="${cls}" style="grid-column:${d}" title="${fmtDate(s)}"></i>`}
    rows+=`<div class="mrow"><span>${cap(MON[m.getMonth()].slice(0,3))}</span><div class="mdays">${cells}</div></div>`;
  }
  const endTxt=`${en.getDate()} de ${MON[en.getMonth()]}`;
  return `<section class="panel" style="margin-bottom:18px"><h2>Curso<span class="count">del ${st.getDate()} de ${MON[st.getMonth()]} al ${endTxt}</span></h2>
   <div class="course"><div><div class="cbig num">${left}</div><div class="clabel">${left===1?'día queda':'días quedan'} hasta el ${endTxt}</div>
    <div class="cbar"><i style="width:${pct}%"></i></div>
    <div class="cstats"><div><b class="num">${passed}</b><span>días hechos</span></div><div><b class="num">${pct}%</b><span>del curso</span></div><div><b class="num">${lect}</b><span>días de clase</span></div><div><b class="num">${weeks}</b><span>${weeks===1?'semana':'semanas'}</span></div></div></div>
   <div class="months">${rows}<div class="legend" style="margin-top:8px"><span><i class="sq p" style="width:11px;display:inline-block"></i>Pasado</span><span><i class="sq t" style="width:11px;display:inline-block"></i>Hoy</span><span><i class="sq" style="width:11px;display:inline-block"></i>Lo que falta</span></div></div></div></section>`;
}

  S.sharedIds=[...ids];let dirty=false;
  items().forEach(([type,o])=>{const d=shareData(type,o),h=hashOf(d);if(h!==o._sh){o._sh=h;dirty=true;fdb().ref('compartidos/'+o.shareId).update({data:d,updatedAt:Date.now()}).catch(()=>{})}});

  else if(t.dataset.onbcur){o.curso=isNaN(+t.dataset.onbcur)?t.dataset.onbcur:+t.dataset.onbcur;renderOnb()}
  else if(t.dataset.onbmod){o.mod=t.dataset.onbmod;renderOnb()}
  else if(t.dataset.onbsub){const x=t.dataset.onbsub;o.subs.has(x)?o.subs.delete(x):o.subs.add(x);t.classList.toggle('on');onbRefreshBtn()}
  else if(t.dataset.onbadd!==undefined){const i=$('#onbAdd');const v=i.value.trim();if(v){o.extra.push(v);o.subs.add(v);renderOnb();setTimeout(()=>$('#onbAdd')?.focus(),0)}}
  else if(t.dataset.onbback!==undefined){o.step--;renderOnb()}
  else if(t.dataset.onbskip!==undefined){if(!o.fromSettings&&!S.perfil){S.perfil={skipped:true,corta:'MCF',etiqueta:''};save()}$('#onb').hidden=true;ONB=null;render()}
  else if(t.dataset.onbnext!==undefined&&onbCanNext()){const st=['nivel','curso','fechas','asig','fin'][o.step];
    if(st==='curso'){const d=courseDefaults(o.nivel,o.curso);if(!o.start||!o.fromSettings)o.start=d.start;if(!o.end||!o.fromSettings)o.end=d.end;if(!o.subs.size)presetSelect()}
    if(st==='fin'){onbFinish();return}o.step++;renderOnb()}
});
document.addEventListener('input',e=>{if(!ONB)return;const id=e.target.id;
  if(id==='onbNombre')ONB.nombre=e.target.value;else if(id==='onbStart')ONB.start=e.target.value;else if(id==='onbEnd')ONB.end=e.target.value;onbRefreshBtn()});
document.addEventListener('change',e=>{if(!ONB)return;if(e.target.id==='onbKeep'){ONB.keep=e.target.checked;renderOnb()}});
document.addEventListener('keydown',e=>{if(ONB&&e.target.id==='onbAdd'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-onbadd]').click()}});

/* ---------- Botón flotante (móvil) ---------- */
document.addEventListener('click',e=>{if(e.target.closest('[data-reonb]'))openOnb(true)});
document.addEventListener('click',e=>{if(!e.target.closest('[data-fab]'))return;
  const it=[['task','Deber',I.tasks],['exam','Examen',I.exams],['block','Bloque de estudio',I.plan],['class','Clase del horario',I.classes]];
  modal(`<div class="sheet"><div class="grab"></div><div class="sgrid" style="grid-template-columns:repeat(2,1fr)">${it.map(([k,l,ic])=>`<button type="button" class="sitem" data-fabnew="${k}">${ic}<span>${l}</span></button>`).join('')}<button type="button" class="sitem" data-fabnota>${I.grade}<span>Nota de examen</span></button><button type="button" class="sitem" data-search>${I.search||''}<span>Buscar</span></button></div>
   <button type="button" class="btn ghost" data-close style="width:100%;justify-content:center;margin-top:10px">Cerrar</button></div>`,()=>{});
  document.querySelector('.scrim').classList.add('sheet-scrim')});
document.addEventListener('click',e=>{const n=e.target.closest('[data-fabnew],[data-fabnota]');if(!n)return;$('#modalRoot').innerHTML='';
  if(n.dataset.fabnota!==undefined){UI.view='notas';render();return}
  const k=n.dataset.fabnew;setTimeout(()=>{if(k==='task')openTaskModal();else if(k==='exam')openExamModal();else if(k==='class')openClassModal();else openBlockModal()},0)});

let wasMob=innerWidth<=700;window.addEventListener('resize',()=>{const m=innerWidth<=700;if(m!==wasMob){wasMob=m;if(CUR)render()}});
startAuth();
</script>
</body>
</html>
